openapi: 3.0.3

info:
  title: API de Biblioteca
  description: API para administrar los libros de una biblioteca
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:

  /libros:
    post:
      summary: Registrar un libro
      description: Registra un nuevo libro en la biblioteca
      operationId: registrarLibro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibroRequest'
      responses:
        '201':
          description: Libro registrado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Libro'
        '400':
          description: Datos de entrada inválidos

    get:
      summary: Consultar libros
      description: Obtiene la lista de todos los libros
      operationId: consultarLibros
      responses:
        '200':
          description: Lista de libros obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Libro'

  /libros/titulo/{titulo}:
    get:
      summary: Consultar libro por título
      description: Busca un libro utilizando su título
      operationId: consultarLibroPorTitulo
      parameters:
        - name: titulo
          in: path
          required: true
          description: Título del libro que se desea consultar
          schema:
            type: string
      responses:
        '200':
          description: Libro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Libro'
        '404':
          description: Libro no encontrado

  /libros/{id}:
    put:
      summary: Actualizar un libro
      description: Actualiza los datos de un libro existente
      operationId: actualizarLibro
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del libro
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibroRequest'
      responses:
        '200':
          description: Libro actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Libro'
        '400':
          description: Datos de entrada inválidos
        '404':
          description: Libro no encontrado

    delete:
      summary: Eliminar un libro
      description: Elimina un libro existente
      operationId: eliminarLibro
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del libro
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Libro eliminado correctamente
        '404':
          description: Libro no encontrado

components:

  schemas:

    Libro:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        titulo:
          type: string
          example: El Principito
        autor:
          type: string
          example: Antoine de Saint-Exupéry
        isbn:
          type: string
          example: "978-0156012195"
        anioPublicacion:
          type: integer
          example: 1943
        estado:
          type: string
          example: DISPONIBLE

    LibroRequest:
      type: object
      required:
        - titulo
        - autor
        - isbn
        - anioPublicacion
        - estado
      properties:
        titulo:
          type: string
          example: El Principito
        autor:
          type: string
          example: Antoine de Saint-Exupéry
        isbn:
          type: string
          example: "978-0156012195"
        anioPublicacion:
          type: integer
          example: 1943
        estado:
          type: string
          example: DISPONIBLE