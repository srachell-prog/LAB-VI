openapi: 3.0.3

info:
  title: API de Cursos Universitarios
  description: API para gestionar cursos universitarios
  version: 1.0.0

servers:
  - url: http://localhost:8080

paths:

  /cursos:
    post:
      summary: Crear un curso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
      responses:
        '201':
          description: Curso creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '400':
          description: Datos inválidos

    get:
      summary: Consultar todos los cursos
      responses:
        '200':
          description: Lista de cursos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Curso'

  /cursos/codigo/{codigo}:
    get:
      summary: Consultar curso por código
      parameters:
        - name: codigo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '404':
          description: Curso no encontrado

  /cursos/{id}:
    put:
      summary: Actualizar un curso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
      responses:
        '200':
          description: Curso actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '400':
          description: Datos inválidos
        '404':
          description: Curso no encontrado

    delete:
      summary: Eliminar un curso
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Curso eliminado correctamente
        '404':
          description: Curso no encontrado

components:

  schemas:

    Curso:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: Programación Orientada a Objetos
        codigo:
          type: string
          example: PROG-101
        creditos:
          type: integer
          example: 4
        estado:
          type: string
          example: Activo

    CursoRequest:
      type: object
      required:
        - nombre
        - codigo
        - creditos
        - estado
      properties:
        nombre:
          type: string
          example: Programación Orientada a Objetos
        codigo:
          type: string
          example: PROG-101
        creditos:
          type: integer
          example: 4
        estado:
          type: string
          example: Activo